<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEC Simulator - Results</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>📊 LEC Simulation Results</h1>
            <div class="controls">
                <button onclick="window.location.href='index.html'"
                    style="background: #64748b; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px;">←
                    Back to Hub</button>

                <input type="text" id="scenarioIdInput" placeholder="Enter Scenario ID"
                    style="padding: 8px; border: 2px solid #e2e8f0; border-radius: 5px; margin-right: 10px; width: 200px;">

                <select id="marketModelSelect"
                    style="padding: 8px; border: 2px solid #e2e8f0; border-radius: 5px; margin-right: 10px;">
                    <option value="P2PNashBargaining">P2P Nash Bargaining</option>
                    <option value="CommunitySelfConsumption">Community Self-Consumption</option>
                    <option value="SDRPricing">SDR Pricing</option>
                    <option value="PayAsClear">Pay-as-Clear</option>
                </select>

                <button onclick="runSimulation()"
                    style="background: #10b981; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px;">▶
            </div>
    </div>
    <script src="results_app.js"></script>
</body>

</html>
